// Minimal bind9 config for the local edgemanage harness.

include "/etc/bind/rndc.key";

// Allow `rndc reload` from the edgemanage container. Wide open because this
// network is local-only and the key is a committed throwaway.
controls {
	inet * port 953 allow { any; } keys { "rndc-key"; };
};

options {
	// Same directory as edgemanage's `named_dir`, shared via a named volume.
	directory "/var/cache/bind";
	listen-on { any; };
	listen-on-v6 { none; };
	allow-query { any; };
	recursion no;
	dnssec-validation no;
	pid-file "/var/run/named/named.pid";
};

logging {
	channel stderr_log {
		stderr;
		severity info;
		print-category yes;
		print-severity yes;
	};
	category default { stderr_log; };
	category queries { stderr_log; };
};

// These files are written by edgemanage. The entrypoint seeds placeholders so
// named starts cleanly before the first edge_manage run.
zone "test.local" {
	type master;
	file "/var/cache/bind/test.local.zone";
};

zone "example.local" {
	type master;
	file "/var/cache/bind/example.local.zone";
};
